l_japanese:
 JRK_BOOKMARK_NAME:0 "日本裂島記 — 2005年"
 JRK_BOOKMARK_DESC:0 "列島戦争から半世紀。二つの日本は長い停戦を維持してきた。2005年、土岐市の核融合炉、そこに連携する高火力レーザー基地、西日本防空網をめぐる一連の攻撃が均衡を崩し、日本アルプスで大規模な突破作戦が始まろうとしている。"
 EJP:0 "東日本"
 EJP_DEF:0 "東日本"
 EJP_ADJ:0 "東日本"
 WJP:0 "西日本"
 WJP_DEF:0 "西日本"
 WJP_ADJ:0 "西日本"
 EJP_JRK_BOOKMARK_HISTORY:0 "豊聡耳神子を中心とする東日本。長期停戦の限界を見据え、中央山岳地帯と東海方面を想定した軍事準備が進んでいる。"
 WJP_JRK_BOOKMARK_HISTORY:0 "東風谷早苗政権の西日本。土岐市の核融合計画とそれに結びつく防衛設備を抱え、東側の軍事的圧力に直面している。"

 EJP_miko:0 "豊聡耳神子"
 EJP_marisa:0 "霧雨魔理沙"
 WJP_sanae:0 "東風谷早苗"
 WJP_reimu:0 "博麗霊夢"

 JRK_divided_archipelago:0 "二つの日本"
 JRK_divided_archipelago_desc:0 "列島は長期にわたり二国家へ分断され、物流・軍事計画・国家運営のすべてが境界線を前提としている。"
 EJP_wartime_command_structure:0 "戦時指揮体制"
 EJP_wartime_command_structure_desc:0 "停戦崩壊を想定した統合指揮手順が整備され、平時組織は急速に作戦遂行へ移行できる。これはゲーム上の抽象化であり、固有の制度名を設定するものではない。"
 EJP_military_priority:0 "軍需優先"
 EJP_military_priority_desc:0 "戦争に備えて生産能力の一部が軍需へ優先配分されている。"
 EJP_internal_surveillance:0 "国内監視の強化"
 EJP_internal_surveillance_desc:0 "作戦秘匿と治安維持を理由に監視が強化されている。"
 WJP_industrial_network:0 "西日本産業網"
 WJP_industrial_network_desc:0 "民需と軍需の双方を支える企業・研究機関・交通網が西日本の生産基盤となっている。"
 WJP_fragmented_air_defense:0 "脆弱化した防空網"
 WJP_fragmented_air_defense_desc:0 "長期運用で複雑化した防空システムは、統合運用とサイバー防御の双方に弱点を抱えている。"
 WJP_yatagarasu_program:0 "ヤタガラス計画"
 WJP_yatagarasu_program_desc:0 "土岐市の核融合研究を中核とする計画。関連する高出力設備は軍事上も重要な意味を持つ。"
 WJP_civil_defense:0 "民間防衛網"
 WJP_civil_defense_desc:0 "行政・企業・交通を結び、攻撃下でも国家機能を維持するための防衛計画。"

 EJP_command_network_stage1:0 "統合指揮網"
 EJP_command_network_stage2:0 "統合指揮網・作戦段階"
 EJP_alpine_offensive_timed:0 "日本アルプス大突破"
 WJP_air_defense_stage1:0 "防空網復旧"
 WJP_air_defense_stage2:0 "統合防空網"
 WJP_cyber_disruption_timed:0 "防空網への侵入"
 WJP_emergency_mobilization_timed:0 "緊急動員"

 EJP_operation_preparation:0 "作戦準備"
 EJP_operation_preparation_desc:0 "長期停戦の崩壊を見据え、部隊・航空・通信の準備を最終段階へ進める。"
 EJP_strike_toki:0 "土岐市核融合炉への攻撃"
 EJP_strike_toki_desc:0 "土岐市の核融合炉をめぐる攻撃を実行し、西日本の対応を揺さぶる。現場の実行主体や正式な作戦名は未確定のため定義しない。"
 EJP_seize_laser_base:0 "関連レーザー基地の掌握"
 EJP_seize_laser_base_desc:0 "核融合炉と連携する高火力レーザー基地を掌握し、西日本の迎撃能力を削る。施設の正式名称は未確定として扱う。"
 EJP_hack_western_air_defense:0 "西日本防空網をハッキング"
 EJP_hack_western_air_defense_desc:0 "防空・通信ネットワークへ侵入し、初動の探知・迎撃・指揮を混乱させる。"
 EJP_break_the_alps:0 "日本アルプス大突破"
 EJP_break_the_alps_desc:0 "準備された地上戦力を中央山岳地帯へ投入し、東海方面へ戦線を突破する。"
 EJP_press_tokai:0 "東海へ圧力を集中"
 EJP_press_tokai_desc:0 "突破後の主力を東海へ集中し、西日本の戦線再構築を妨げる。"
 EJP_drive_west:0 "西進を継続"
 EJP_drive_west_desc:0 "戦果を拡張し、西日本中枢へ持続的な軍事圧力を加える。"
 EJP_expand_military_industry:0 "軍需生産を拡張"
 EJP_expand_military_industry_desc:0 "関東・東北の生産力を初期戦役へ向けて増強する。"
 EJP_central_logistics:0 "中央山岳兵站"
 EJP_central_logistics_desc:0 "山岳作戦の弱点となる道路・輸送・補給能力を重点整備する。"
 EJP_strategic_stockpile:0 "戦略備蓄"
 EJP_strategic_stockpile_desc:0 "開戦初期の損耗を吸収できるだけの小火器と支援装備を確保する。"
 EJP_field_headquarters:0 "前線軍司令部"
 EJP_field_headquarters_desc:0 "1.19系のArmy HQを前提に、指揮系統を前線運用へ適応させる。"
 EJP_modern_armor:0 "主力戦車部隊"
 EJP_modern_armor_desc:0 "No Step Backの戦車設計と初期生産ラインを活用し、機動打撃力を整える。"
 EJP_marisa_air_concept:0 "魔理沙の航空運用構想"
 EJP_marisa_air_concept_desc:0 "東側に属する霧雨魔理沙を航空戦力の主要指揮官として、速度と集中運用を重視する。"
 EJP_integrated_air_defense:0 "東側防空の統合"
 EJP_integrated_air_defense_desc:0 "主要地域の対空火力と迎撃体制を強化する。"
 EJP_internal_security:0 "国内警戒を強化"
 EJP_internal_security_desc:0 "作戦前の情報漏洩と混乱を抑えるため治安・監視能力を強化する。"
 EJP_war_cabinet:0 "戦時意思決定"
 EJP_war_cabinet_desc:0 "開戦後の政治・軍事決定を迅速化する。"

 WJP_emergency_cabinet:0 "緊急閣議"
 WJP_emergency_cabinet_desc:0 "東側の動向を受け、早苗政権は危機対応へ移行する。"
 WJP_harden_toki:0 "土岐周辺を警戒"
 WJP_harden_toki_desc:0 "核融合炉周辺の警戒を強化し、重要設備への攻撃に備える。"
 WJP_secure_laser_base:0 "関連レーザー基地を防護"
 WJP_secure_laser_base_desc:0 "核融合炉と連携する高火力レーザー基地の防護を強化する。正式名称は未確定として扱う。"
 WJP_restore_air_defense:0 "防空網を復旧"
 WJP_restore_air_defense_desc:0 "侵入を受けた系統を切り離し、バックアップを使って防空網を再構築する。"
 WJP_hold_tokai:0 "東海を保持せよ"
 WJP_hold_tokai_desc:0 "日本アルプスから流入する攻勢を東海で止め、戦線の崩壊を防ぐ。"
 WJP_kansai_defense:0 "関西防衛態勢"
 WJP_kansai_defense_desc:0 "東海の後方に防衛縦深を設け、中枢への直接突破を防ぐ。"
 WJP_counteroffensive:0 "反撃準備"
 WJP_counteroffensive_desc:0 "防空網と機甲予備を再編し、攻勢側の突出部を押し戻す。"
 WJP_industrial_coordination:0 "産業調整"
 WJP_industrial_coordination_desc:0 "戦時生産へ必要な工業・物流能力を政府計画へ接続する。"
 WJP_disperse_industry:0 "生産拠点を分散"
 WJP_disperse_industry_desc:0 "一地域への打撃で生産が停止しないよう西方へ生産能力を分散する。"
 WJP_yatagarasu_program_focus:0 "ヤタガラス計画を維持"
 WJP_yatagarasu_program_focus_desc:0 "攻撃下でも核融合研究と関連技術を維持する。"
 WJP_field_headquarters:0 "西日本軍司令部"
 WJP_field_headquarters_desc:0 "1.19系Army HQを用いて現代化された前線指揮を構成する。"
 WJP_reimu_defense_concept:0 "霊夢の防衛構想"
 WJP_reimu_defense_concept_desc:0 "西側に属する博麗霊夢を主要指揮官として、要点防御と反撃余力の維持を重視する。"
 WJP_mechanized_reserve:0 "機甲予備隊"
 WJP_mechanized_reserve_desc:0 "東海・関西間を迅速に移動できる機甲戦力を確保する。"
 WJP_f15_interceptors:0 "F-15J迎撃隊"
 WJP_f15_interceptors_desc:0 "By Blood Aloneの航空機設計を使った初期制空戦闘機を実戦運用する。"
 WJP_civil_defense_network:0 "民間防衛網"
 WJP_civil_defense_network_desc:0 "行政・企業・交通を戦時継続計画へ組み込む。"

 JRK_east_operations:0 "東日本作戦"
 EJP_recon_alpine_routes:0 "中央山岳路を偵察"
 EJP_emergency_logistics:0 "山岳兵站を緊急強化"
 JRK_west_emergency:0 "西日本緊急対策"
 WJP_restore_backup_air_defense:0 "予備防空網を起動"
 WJP_counter_cyber_response:0 "侵入系統を遮断"
 WJP_emergency_tokai_mobilization:0 "東海緊急動員"

 JRK.1.t:0 "長い停戦の末に"
 JRK.1.d:0 "二つの日本は長期停戦の限界へ近づいている。東側では中央山岳地帯と東海を想定した準備が進み、核融合炉・関連レーザー基地・西日本防空網が同じ作戦上の問題として扱われ始めた。"
 JRK.1.a:0 "準備を進める。"
 JRK.2.t:0 "境界線の緊張"
 JRK.2.d:0 "西日本では東側の部隊移動と通信量の増加が観測されている。確定的な開戦情報はないが、土岐市と防空網の警戒を同時に強める必要がある。"
 JRK.2.a:0 "警戒を引き上げる。"
 JRK.10.t:0 "土岐市核融合炉への攻撃"
 JRK.10.d:0 "土岐市の核融合炉をめぐって攻撃が発生した。被害の全容と実行部隊の詳細はまだ確定していない。"
 JRK.10.a:0 "重要施設を防護せよ。"
 JRK.11.t:0 "関連レーザー基地が掌握される"
 JRK.11.d:0 "核融合炉と連携する高火力レーザー基地が敵側に掌握された。正式な施設名称や現場の指揮系統は不明だが、防空上の影響は明白だ。"
 JRK.11.a:0 "防衛配置を再構成する。"
 JRK.12.t:0 "西日本防空網への侵入"
 JRK.12.d:0 "複数の防空・通信系統で侵入が確認された。探知情報の共有と迎撃指揮が混乱し、敵の地上作戦を迎えるには最悪の瞬間となった。"
 JRK.12.a:0 "予備系統へ切り替えろ。"
 JRK.13.t:0 "日本アルプス大突破"
 JRK.13.d:0 "東日本軍が中央山岳地帯から大規模な攻勢を開始した。長い停戦は終わり、西日本軍は東海方面で突破を止めなければならない。"
 JRK.13.a:0 "西日本を守る。"
